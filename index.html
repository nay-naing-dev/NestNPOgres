<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backend လမ်းပြ · NestJS နဲ့ PostgreSQL</title>
    <meta name="description" content="NestJS နဲ့ PostgreSQL ကို animation, SQL လက်တွေ့နဲ့ mini project တွေနဲ့ သင်ယူရန်" />
    <script>
      // Set the theme before first paint so the page never flashes the wrong colours.
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('backend-lanpya-theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
